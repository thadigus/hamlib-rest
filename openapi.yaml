components:
  schemas:
    ConfigRequest:
      properties:
        name:
          type: string
          title: Name
          description: Config key
        value:
          type: string
          title: Value
          description: Config value
      type: object
      required:
      - name
      - value
      title: ConfigRequest
    DCSValue:
      properties:
        code:
          type: integer
          title: Code
          description: DCS code
      type: object
      required:
      - code
      title: DCSValue
    DTMFRequest:
      properties:
        digits:
          type: string
          title: Digits
          description: DTMF digits to send
      type: object
      required:
      - digits
      title: DTMFRequest
    Frequency:
      properties:
        frequency:
          type: number
          title: Frequency
          description: Frequency in Hz
      type: object
      required:
      - frequency
      title: Frequency
    FunctionState:
      properties:
        function:
          type: string
          title: Function
          description: Function constant name, e.g. RIG_FUNC_NB
        state:
          type: integer
          title: State
          description: 0 or 1
      type: object
      required:
      - function
      - state
      title: FunctionState
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InitRigRequest:
      properties:
        model:
          type: integer
          title: Model
          description: Hamlib rig model number
        port:
          type: string
          title: Port
          description: Serial/USB/TCP rig path
        baud:
          type: integer
          title: Baud
          description: Serial baud rate
        conf:
          type: object
          title: Conf
          description: Optional backend config parameters to apply on init
      type: object
      required:
      - model
      title: InitRigRequest
    LevelChange:
      properties:
        level:
          type: string
          title: Level
          description: Level constant name, e.g. RIG_LEVEL_SQL
        value:
          type: number
          title: Value
          description: Level value
      type: object
      required:
      - level
      - value
      title: LevelChange
    MemoryBank:
      properties:
        bank:
          type: integer
          title: Bank
          description: Memory bank number
      type: object
      required:
      - bank
      title: MemoryBank
    MemoryChannel:
      properties:
        channel:
          type: integer
          title: Channel
          description: Memory channel number
      type: object
      required:
      - channel
      title: MemoryChannel
    Mode:
      properties:
        mode:
          type: string
          title: Mode
          description: Mode name, e.g. USB or RIG_MODE_USB
        width:
          type: integer
          title: Width
          description: Filter width / passband in Hz
      type: object
      required:
      - mode
      title: Mode
    MorseRequest:
      properties:
        message:
          type: string
          title: Message
          description: Morse text to send
      type: object
      required:
      - message
      title: MorseRequest
    PTTState:
      properties:
        state:
          title: State
          description: PTT state (bool/int/name)
      type: object
      required:
      - state
      title: PTTState
    ParameterState:
      properties:
        parameter:
          type: string
          title: Parameter
          description: Parameter constant name, e.g. RIG_PARM_TIME
        value:
          type: number
          title: Value
          description: Parameter value
      type: object
      required:
      - parameter
      - value
      title: ParameterState
    Passband:
      properties:
        width:
          type: integer
          title: Width
          description: Passband width in Hz
      type: object
      required:
      - width
      title: Passband
    PowerState:
      properties:
        state:
          title: State
          description: Power state (int/name)
      type: object
      required:
      - state
      title: PowerState
    RIT:
      properties:
        offset:
          type: integer
          title: Offset
          description: RIT offset in Hz
      type: object
      required:
      - offset
      title: RIT
    RepeaterConfig:
      properties:
        shift:
          type: string
          title: Shift
          description: RIG_RPT_SHIFT_* value
        offset:
          type: integer
          title: Offset
          description: Repeater offset in Hz
      type: object
      title: RepeaterConfig
    ResetRequest:
      properties:
        reset:
          type: string
          title: Reset
          description: Reset type, e.g. RIG_RESET_SOFT
      type: object
      required:
      - reset
      title: ResetRequest
    ScanRequest:
      properties:
        scan:
          type: string
          title: Scan
          description: Scan type, e.g. RIG_SCAN_MEM
        channel:
          type: integer
          title: Channel
          description: Optional channel index
          default: 0
      type: object
      required:
      - scan
      title: ScanRequest
    SplitConfig:
      properties:
        enabled:
          type: boolean
          title: Enabled
          description: Split on/off
        tx_freq:
          type: number
          title: Tx Freq
          description: TX frequency in Hz
        tx_vfo:
          type: string
          title: Tx Vfo
          description: TX VFO name
        mode:
          type: string
          title: Mode
          description: TX mode
        width:
          type: integer
          title: Width
          description: TX passband width in Hz
      type: object
      title: SplitConfig
    ToneValue:
      properties:
        tone:
          type: integer
          title: Tone
          description: Tone value
      type: object
      required:
      - tone
      title: ToneValue
    TransceiveState:
      properties:
        state:
          title: State
          description: Transceive mode
      type: object
      required:
      - state
      title: TransceiveState
    TuningStep:
      properties:
        step:
          type: integer
          title: Step
          description: Tuning step in Hz
      type: object
      required:
      - step
      title: TuningStep
    VFOOpRequest:
      properties:
        op:
          type: string
          title: Op
          description: VFO operation, e.g. RIG_OP_UP
      type: object
      required:
      - op
      title: VFOOpRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    XIT:
      properties:
        offset:
          type: integer
          title: Offset
          description: XIT offset in Hz
      type: object
      required:
      - offset
      title: XIT
  securitySchemes:
    HTTPBasic:
      type: http
      scheme: basic
