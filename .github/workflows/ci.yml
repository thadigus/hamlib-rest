name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: self-hosted
    container:
      image: ubuntu:24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install test dependencies
        run: |
          apt-get install -y -qq --no-install-recommends \
            curl \
            jq \
            libhamlib-utils \
            python3 \
            python3-fastapi \
            python3-hamlib \
            python3-httpx \
            python3-pytest \
            python3-serial \
            uvicorn

      - name: Run tests
        run: pytest

  publish:
    needs: test
    runs-on: self-hosted
    container:
      image: gcr.io/kaniko-project/executor:debug
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: sh

    steps:
      - name: Authenticate to GHCR
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p /kaniko/.docker
          printf '{"auths":{"%s":{"auth":"%s"}}}' \
            "$REGISTRY" \
            "$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 | tr -d '\n')" \
            > /kaniko/.docker/config.json

      - name: Build and push runtime image
        env:
          GIT_USERNAME: ${{ github.actor }}
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          IMAGE="${REGISTRY}/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          /kaniko/executor \
            --context "git://github.com/${GITHUB_REPOSITORY}.git#${GITHUB_REF}#${GITHUB_SHA}" \
            --dockerfile ./Dockerfile \
            --target runtime \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --destination "${IMAGE}:latest" \
            --destination "${IMAGE}:${GITHUB_SHA}"
